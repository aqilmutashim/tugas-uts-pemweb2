<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Study Buddy</title>
<style>
:root{--pr:#7c6cf0;--pl:#efecff;--bg:#f7f6fb;--cd:#fff;--bd:#e8e6f1;--tx:#26233a;--mu:#7b7893;--sh:0 2px 12px rgba(80,60,160,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--pl:#2a2745;--bg:#16151f;--cd:#1f1e2b;--bd:#2f2d40;--tx:#ece9f8;--mu:#9a97b3;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--pl:#2a2745;--bg:#16151f;--cd:#1f1e2b;--bd:#2f2d40;--tx:#ece9f8;--mu:#9a97b3;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
h2{margin:0 0 4px;font-size:24px}h3{margin:22px 0 10px;font-size:16px}
.mu,small{color:var(--mu)}a{color:var(--pr);cursor:pointer;font-weight:600}
#app{display:flex;height:100%}aside{width:230px;background:var(--cd);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.lg{font-weight:700;font-size:18px;padding:6px 10px 14px}
.ni{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--tx);font-weight:500;cursor:pointer;position:relative}
.ni:hover{background:var(--pl)}.ni.on{background:var(--pr);color:#fff}.ni.off{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;margin-left:auto}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid var(--bd);cursor:pointer;border-radius:12px}.me:hover,.me.on{background:var(--pl)}.me small{display:block}
main{flex:1;overflow:auto;padding:22px 32px}
.top{display:flex;justify-content:flex-end;margin-bottom:8px;position:relative}
.bell{position:relative}.bell em{background:#ef4444;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-style:normal;margin-left:4px}
.dd{position:absolute;right:0;top:44px;width:340px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:12px;z-index:20;max-height:70vh;overflow:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.f1{flex:1;min-width:0}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.st b{display:block;font-size:24px;color:var(--pr)}
.b{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}.b:hover{filter:brightness(1.08)}
.b.s{background:var(--pl);color:var(--pr)}.b.d{background:#ef4444;color:#fff}.b.w{width:100%;margin-top:14px}.b.sm{padding:4px 10px;font-size:12px}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px;resize:vertical}label{display:block;font-weight:600;margin:10px 0 4px;font-size:13px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.sp{grid-column:1/-1}.fg4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex:none}
.tag{background:var(--pl);color:var(--pr);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;display:inline-block;margin:2px 4px 2px 0}
.bc{display:flex;flex-direction:column;gap:8px}.empty{text-align:center;color:var(--mu);padding:28px}
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}.ac{width:400px;max-width:100%;padding:28px}.ac.wide{width:620px}.ac h1{margin:0}.c{text-align:center}
.dg{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:14px}.chat{display:flex;flex-direction:column;height:calc(100vh - 220px);min-height:360px;padding:0}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.cmp{display:flex;gap:6px;padding:12px;border-top:1px solid var(--bd)}.cmp .b{padding:8px 11px}
.m{max-width:75%;padding:9px 13px;border-radius:14px;background:var(--pl)}.m.me{align-self:flex-end;background:var(--pr);color:#fff}.m small{display:block;opacity:.75;font-size:11px}.m.me small{color:#fff}.m a{color:inherit;text-decoration:underline}
.it{margin:4px 0 6px;word-break:break-all}.dg textarea{min-height:240px}
.mb{position:fixed;inset:0;background:rgba(20,16,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.mc{background:var(--cd);border-radius:18px;padding:22px;width:440px;max-width:100%;max-height:90vh;overflow:auto}.mc h3{margin-top:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2d2a45;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.tg{display:flex;justify-content:space-between;padding:8px 0}.tg input{width:auto}
@media(max-width:900px){aside{width:180px}.dg{grid-template-columns:1fr}.fg4{grid-template-columns:1fr 1fr}main{padding:16px}}
</style></head><body><div id="root"></div><div id="md"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let BUD=[];
let S={me:null,page:'home',theme:'system',nt:{req:1,acc:1,dis:1,oth:1}},ST=null;try{Object.assign(S,JSON.parse(localStorage.getItem('sb_ui')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('sb_ui',JSON.stringify({theme:S.theme,nt:S.nt}))}catch(e){}};
const D=()=>ST,bud=id=>BUD.find(b=>b.id==id);
let am='login',F={p:'',s:'',sub:'',m:''},LM=null;
const av=(n,c,z=40)=>`<span class="av" style="width:${z}px;height:${z}px;background:${c||'var(--pr)'};font-size:${Math.round(z*.4)}px">${esc((n||'?')[0].toUpperCase())}</span>`;
function toast(m,k){if(k&&!S.nt[k])return;const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const modal=h=>$('md').innerHTML=`<div class="mb" onclick="if(event.target===this)cm()"><div class="mc">${h}</div></div>`,cm=()=>$('md').innerHTML='';
const go=p=>{S.page=p;save();render()};
const nav=k=>{if(k=='disc'&&!D().ses)return toast('Diskusi tersedia saat ada match aktif');go(k)};
const dur=s=>{const t=Math.floor((Date.now()-s.t0)/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function sc(b,x=[]){const p=D().prof,all=[...p.sub,...x].map(v=>v.toLowerCase());let n=40+25*b.sub.filter(v=>all.some(a=>v.toLowerCase().includes(a)||a.includes(v.toLowerCase()))).length;if(p.mode=='Keduanya'||p.mode==b.m)n+=15;if(b.p==p.prodi)n+=10;return Math.min(n,98)}
const rank=(x=[])=>[...BUD].sort((a,b)=>sc(b,x)-sc(a,x));
const badges=()=>{const d=D(),b=['Pemula'];if(d.stat.d>=1)b.push('Diskusi Pertama');if(d.stat.d>=5)b.push('Rajin Belajar');if(d.arc.length)b.push('Kolektor Materi');return b};
const card=(b,x)=>`<div class="cd bc"><div class="row">${av(b.n,b.c,46)}<div class="f1"><b>${esc(b.n)}</b><div class="mu">${esc(b.p)} · Smt ${b.s}</div></div></div><div>${b.sub.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}<span class="tag">${b.m}</span></div><div class="mu">${esc(b.bio)}</div><small>Kecocokan ${sc(b,x)}%</small><div class="row"><button class="b s" onclick="viewP(${b.id})">Lihat Profil</button><button class="b" onclick="sendM(${b.id})">Kirim Permintaan</button></div></div>`;
function viewP(id){const b=bud(id);modal(`<div class="row">${av(b.n,b.c,56)}<div><h3 style="margin:0">${esc(b.n)}</h3><div class="mu">${esc(b.p)} · Semester ${b.s}</div></div></div><p>${esc(b.bio)}</p><div>${b.sub.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div><p class="mu">Mode: ${b.m}</p><button class="b s" onclick="cm()">Tutup</button>`)}
/* ===== Auth ===== */
const authV=()=>`<div class="auth"><div class="cd ac"><h1>Study Buddy</h1><p class="mu">Temukan teman belajar di kampusmu.</p>${am=='login'?`<label>Email kampus</label><input id="e" type="email" placeholder="nama@kampus.ac.id"><label>Kata sandi</label><input id="p" type="password"><button class="b w" onclick="login()">Masuk</button><p class="c"><a onclick="toast('Tautan reset dikirim ke email kampusmu (simulasi)')">Lupa kata sandi?</a></p><p class="c">Belum punya akun? <a onclick="am='reg';render()">Daftar</a></p>`:`<label>Nama lengkap</label><input id="n"><label>Email kampus</label><input id="e" type="email" placeholder="nama@kampus.ac.id"><label>Kata sandi</label><input id="p" type="password"><label>Konfirmasi kata sandi</label><input id="p2" type="password"><button class="b w" onclick="reg()">Daftar</button><p class="c">Sudah punya akun? <a onclick="am='login';render()">Masuk</a></p>`}</div></div>`;
const setupV=()=>{const u={n:D().name||''};return `<div class="auth"><div class="cd ac wide"><h2>Lengkapi Profilmu</h2><p class="mu">Wajib diisi sebelum masuk ke beranda.</p><div class="fg"><div><label>Nama lengkap</label><input id="s1" value="${esc(u.n)}"></div><div><label>Program studi</label><input id="s2"></div><div><label>Semester</label><input id="s3" type="number" min="1" max="14"></div><div><label>Mode diskusi</label><select id="s4"><option>Online</option><option>Offline</option><option>Keduanya</option></select></div><div class="sp"><label>Bio singkat</label><textarea id="s5"></textarea></div><div class="sp"><label>Mata kuliah favorit (pisahkan koma)</label><input id="s6" placeholder="Basis Data, Algoritma"></div><div class="sp"><label>Jadwal belajar pilihan</label><input id="s7" placeholder="Senin-Rabu malam"></div></div><button class="b w" onclick="setupS()">Simpan &amp; Lanjut</button></div></div>`};
/* ===== Pages ===== */
const PG={
home(){const d=D(),p=d.prof,s=d.stat,ses=d.ses,b=ses&&bud(ses.p);return `<h2>Halo, ${esc(p.name.split(' ')[0])}! </h2><p class="mu">Siap belajar bareng hari ini?</p><div class="g4">${[['Jam belajar',s.h.toFixed(1)],['Diskusi',s.d],['Study buddy',s.b],['Rating',s.d?'4.8':'—'],['Badge',badges().length]].map(([l,v])=>`<div class="cd st"><small>${l}</small><b>${v}</b></div>`).join('')}</div><h3>Diskusi Aktif</h3>${ses?`<div class="cd row">${av(b.n,b.c,48)}<div class="f1"><b>${esc(b.n)}</b><div class="mu">${esc(ses.topic)} · <span class="tm">${dur(ses)}</span></div></div><span class="tag">Berlangsung</span><button class="b" onclick="go('disc')">Buka Diskusi</button></div>`:`<div class="cd empty">Belum ada diskusi aktif. Mulai dengan mencari buddy!</div>`}<h3>Aksi Cepat</h3><div class="row"><button class="b" onclick="go('req')">Buat Permintaan</button><button class="b s" onclick="go('find')">Cari Buddy</button><button class="b s" onclick="go('hist')">Riwayat</button></div><h3>Buddy yang Disarankan</h3><div class="g3">${rank().slice(0,3).map(x=>card(x)).join('')}</div>`},
req(){const p=D().prof;return `<h2>Buat Permintaan Belajar</h2><p class="mu">Isi kebutuhanmu, lalu kami cari buddy yang cocok.</p><div class="cd"><div class="fg"><div><label>Program studi</label><input id="r1" value="${esc(p.prodi)}"></div><div><label>Semester</label><input id="r2" type="number" value="${esc(p.sem)}"></div><div><label>Dosen / kelas (opsional)</label><input id="r3"></div><div><label>Mata kuliah</label><input id="r4" placeholder="mis. Basis Data"></div><div class="sp"><label>Topik / materi</label><input id="r5"></div><div><label>Tanggal</label><input id="r6" type="date"></div><div><label>Jam</label><input id="r7" type="time"></div><div><label>Mode</label><select id="r8"><option>Online</option><option>Offline</option></select></div><div class="sp"><label>Catatan (opsional)</label><textarea id="r9"></textarea></div></div><button class="b w" onclick="findM()">Cari Kecocokan</button></div><div id="res">${resH()}</div>`},
find(){return `<h2>Cari Study Buddy</h2><p class="mu">Gunakan filter untuk mempersempit pencarian.</p><div class="cd fg4"><input placeholder="Program studi" value="${esc(F.p)}" oninput="F.p=this.value;flist()"><input placeholder="Semester" type="number" value="${esc(F.s)}" oninput="F.s=this.value;flist()"><input placeholder="Mata kuliah / materi" value="${esc(F.sub)}" oninput="F.sub=this.value;flist()"><select onchange="F.m=this.value;flist()"><option value="">Semua mode</option><option ${F.m=='Online'?'selected':''}>Online</option><option ${F.m=='Offline'?'selected':''}>Offline</option></select></div><h3>Hasil</h3><div id="list" class="g3">${listH()}</div>`},
disc(){const s=D().ses,b=bud(s.p);return `<div class="cd row">${av(b.n,b.c,44)}<div class="f1"><b>${esc(b.n)}</b><div class="mu">Aktif · ${esc(s.topic)}</div></div><b class="tm">${dur(s)}</b><button class="b d" onclick="endM()">Akhiri Diskusi</button></div><div class="dg"><div class="cd chat"><div id="chat"></div><div class="cmp"><button class="b s" title="Bagikan berkas" onclick="$('fi').click()">Berkas</button><button class="b s" title="Bagikan tautan" onclick="linkM()">Tautan</button><button class="b s" title="Telepon suara" onclick="toast('Panggilan suara: placeholder, butuh layanan WebRTC')">Suara</button><button class="b s" title="Video call" onclick="toast('Video call: placeholder, butuh layanan WebRTC')">Video</button><button class="b s" title="Lokasi" onclick="toast('Berbagi lokasi: placeholder, butuh izin geolokasi + backend')">Lokasi</button><input id="mi" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter')sendT()"><button class="b" onclick="sendT()">Kirim</button><input id="fi" type="file" hidden onchange="pickF(this)"></div></div><div class="cd"><h3 style="margin-top:0">Catatan Diskusi</h3><textarea oninput="notesIn(this.value)">${esc(s.notes)}</textarea><small>Catatan ikut terhapus saat diskusi berakhir.</small></div></div>`},
hist(){const h=D().hist;return `<h2>Riwayat Diskusi</h2>${h.length?`<div class="g3" style="margin-top:14px">${h.map(x=>{const b=bud(x.p);return `<div class="cd bc" style="cursor:pointer" onclick="histM(${x.id})"><div class="row">${av(b.n,b.c,42)}<div class="f1"><b>${esc(b.n)}</b><div class="mu">${esc(x.topic)}</div></div></div><small>${x.date} · ${x.dur} menit · <span class="tag">${x.st}</span></small></div>`}).join('')}</div>`:`<div class="cd empty" style="margin-top:14px">Belum ada riwayat diskusi.</div>`}`},
arc(){const a=D().arc;return `<h2>Arsip Berkas</h2><p class="mu">Hanya item yang diizinkan pengirim dan kamu simpan sendiri.</p>${a.length?a.map(x=>`<div class="cd row" style="margin-top:10px"><div class="f1"><b style="word-break:break-all">${esc(x.name)}</b><div class="mu">${x.type=='link'?'Tautan':'Berkas'} · dari ${esc(x.from)} · ${x.date} · ${esc(x.disc)}</div></div><button class="b s" onclick="arcOpen(${x.id})">${x.type=='link'?'Buka':'Unduh'}</button><button class="b d" onclick="arcDel(${x.id})">Hapus</button></div>`).join(''):`<div class="cd empty" style="margin-top:14px">Arsip masih kosong.</div>`}`},
prof(){const d=D(),p=d.prof,s=d.stat;return `<h2>Profil Saya</h2><div class="cd" style="margin-top:14px"><div class="row">${av(p.name,0,72)}<div class="f1"><h3 style="margin:0">${esc(p.name)}</h3><div class="mu">${esc(p.prodi)} · Semester ${esc(p.sem)}</div></div><button class="b" onclick="editM()">Edit Profil</button><button class="b s" onclick="editM()">Edit Kriteria Matching</button></div><p>${esc(p.bio)}</p><div class="g4">${[['Pengikut',0],['Mengikuti',0],['Jam belajar',s.h.toFixed(1)],['Diskusi',s.d],['Rating',s.d?'4.8':'—']].map(([l,v])=>`<div class="st"><small>${l}</small><b>${v}</b></div>`).join('')}</div><h3>Badge</h3>${badges().map(x=>`<span class="tag">${x}</span>`).join('')}<h3>Preferensi</h3>${p.sub.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<p class="mu">Ketersediaan: ${esc(p.sch)} · Mode: ${p.mode}</p></div>`},
set(){const n=S.nt,L={req:'Permintaan match',acc:'Match diterima',dis:'Diskusi',oth:'Notifikasi lainnya'};return `<h2>Pengaturan</h2><div class="cd" style="margin-top:14px"><h3 style="margin-top:0">Tampilan</h3><div class="row">${[['light','Terang'],['dark','Gelap'],['system','Sistem']].map(([k,l])=>`<label style="margin:0"><input type="radio" name="th" style="width:auto" ${S.theme==k?'checked':''} onchange="S.theme='${k}';save();render()"> ${l}</label>`).join('')}</div><h3>Notifikasi</h3>${Object.keys(L).map(k=>`<div class="tg"><span>${L[k]}</span><input type="checkbox" ${n[k]?'checked':''} onchange="S.nt.${k}=this.checked?1:0;save()"></div>`).join('')}<h3>Akun</h3><div class="row"><button class="b s" onclick="editM()">Edit profil</button><button class="b s" onclick="pwM()">Ganti kata sandi</button><button class="b s" onclick="S.theme='system';S.nt={req:1,acc:1,dis:1,oth:1};save();render();toast('Pengaturan dikembalikan ke default')">Reset pengaturan</button><button class="b d" onclick="outM()">Keluar</button></div></div>`}};
const NAV=[['home','Beranda'],['req','Buat Permintaan'],['find','Cari Buddy'],['disc','Diskusi'],['hist','Riwayat'],['arc','Arsip Berkas'],['set','Pengaturan']];
function shell(){const d=D(),p=d.prof;return `<div id="app"><aside><div class="lg"><span class="nl">Study Buddy</span></div>${NAV.map(([k,l])=>`<a class="ni ${S.page==k?'on':''} ${k=='disc'&&!d.ses?'off':''}" onclick="nav('${k}')"><span class="nl">${l}</span>${k=='disc'&&d.ses?'<i class="dot"></i>':''}</a>`).join('')}<div class="me ${S.page=='prof'?'on':''}" onclick="nav('prof')" title="Buka profil">${av(p.name,0,36)}<div class="nl"><b>${esc(p.name)}</b><small>${esc(p.prodi)}</small></div></div></aside><main><div class="top"><div class="bell"><button class="b s" onclick="dd()">Notifikasi${d.inc.length?`<em>${d.inc.length}</em>`:''}</button><div id="dd" class="dd" hidden></div></div></div>${PG[S.page]()}</main></div>`}
function render(){const t=S.theme;if(t=='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;const r=$('root');
 if(!S.me||!D())r.innerHTML=authV();else if(!D().prof)r.innerHTML=setupV();else{if(S.page=='disc'&&!D().ses)S.page='home';r.innerHTML=shell();if(S.page=='disc')drawChat()}}
/* ===== Request & match ===== */
function resH(){const d=D();let h='';if(LM)h+=`<h3>Rekomendasi Buddy</h3><div class="g3">${rank(LM.x).slice(0,4).map(b=>card(b,LM.x)).join('')}</div>`;const a=d.reqs.filter(r=>r.st=='aktif');
 return h+`<h3>Permintaan Aktif</h3>${a.length?a.map(r=>`<div class="cd row" style="margin-bottom:8px"><div class="f1"><b>${esc(r.sub)}</b> · ${esc(r.topic)}<div class="mu">${esc(r.date||'-')} ${esc(r.time||'')} · ${r.mode}</div></div><button class="b d" onclick="cancelR(${r.id})">Batalkan</button></div>`).join(''):`<div class="cd empty">Belum ada permintaan aktif.</div>`}`}
function listH(){const l=BUD.filter(b=>(!F.p||b.p.toLowerCase().includes(F.p.toLowerCase()))&&(!F.s||b.s==F.s)&&(!F.sub||b.sub.some(x=>x.toLowerCase().includes(F.sub.toLowerCase())))&&(!F.m||b.m==F.m));return l.length?l.map(b=>card(b)).join(''):'<div class="empty">Tidak ada buddy yang cocok.</div>'}
const flist=()=>$('list').innerHTML=listH();
function sendM(id){const b=bud(id);modal(`<h3>Kirim permintaan ke ${esc(b.n)}</h3><label>Topik</label><input id="q1" value="${esc(b.sub[0])}"><label>Pesan singkat</label><textarea id="q2" style="min-height:60px"></textarea><div class="row" style="margin-top:14px"><button class="b" onclick="doSend(${id})">Kirim</button><button class="b s" onclick="cm()">Batal</button></div>`)}
function dd(keep){const e=$('dd');if(!keep)e.hidden=!e.hidden;if(e.hidden)return;const d=D();e.innerHTML=(d.inc.length?d.inc.map(i=>{const b=bud(i.from);return `<div style="padding:8px 0;border-bottom:1px solid var(--bd)"><div class="row">${av(b.n,b.c,36)}<div class="f1"><b>${esc(b.n)}</b><div class="mu">${esc(i.topic)}</div></div></div><small>${esc(i.time)} · ${i.mode}</small><div>${esc(i.msg)}</div><div class="row" style="margin-top:6px"><button class="b sm" onclick="accI(${i.id})">Terima</button><button class="b s sm" onclick="rejI(${i.id})">Tolak</button></div></div>`}).join(''):'<div class="empty">Tidak ada permintaan masuk.</div>');e.hidden=false}
/* ===== Session ===== */
function drawChat(){const c=$('chat'),s=D().ses;if(!c)return;c.innerHTML=s.msgs.map(m=>{const me=m.f=='me',t=new Date(m.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});let b;
 if(m.t=='txt')b=esc(m.x);else{const lk=m.t=='link';b=`<div class="it"><span style="opacity:.75">${lk?'Tautan':'Berkas'}:</span> <b>${esc(m.name)}</b> <a onclick="${lk?'openU':'viewF'}(${m.id})">${lk?'Buka':'Lihat'}</a></div>`+(me?`<small>${m.allow?'Boleh disimpan penerima':'Tidak boleh disimpan penerima'}</small>`:m.allow?(m.saved?'<small>Tersimpan di Arsip</small>':`<button class="b s sm" onclick="saveArc(${m.id})">Simpan ke Arsip</button>`):'<small>Tidak dapat disimpan</small>')}
 return `<div class="m ${me?'me':''}"><small>${me?'Kamu':esc(bud(s.p).n)} · ${t}</small>${b}</div>`}).join('');c.scrollTop=c.scrollHeight}
let pend=null;const OK=['png','jpg','jpeg','pdf','doc','docx','ppt','pptx','xls','xlsx','txt'];
function linkM(){pend={k:'link'};shareM()}
function shareM(){const l=pend.k=='link',w=l?'tautan':'berkas';modal(`<h3>Bagikan ${w}</h3>${l?'<input id="lu" placeholder="https://contoh.com">':`<p><b>${esc(pend.name)}</b></p>`}<p>Izinkan study buddy-mu menyimpan ${w} ini ke Arsip?</p><div class="row"><button class="b" onclick="conf(true)">Izinkan Menyimpan</button><button class="b s" onclick="conf(false)">Tidak Izinkan</button></div><small>Izin ditentukan per item. Menutup jendela ini membatalkan pengiriman.</small>`)}
const msgOf=id=>D().ses.msgs.find(m=>m.id==id);
function openU(id){const m=msgOf(id);window.open(m.url,'_blank','noopener')}
function endM(){modal(`<h3>Akhiri diskusi?</h3><p>Chat, berkas sementara, tautan, dan catatan akan dihapus. Item yang sudah kamu simpan di Arsip tetap aman.</p><div class="row"><button class="b d" onclick="endS()">Ya, Akhiri</button><button class="b s" onclick="cm()">Batal</button></div>`)}
function histM(id){const x=D().hist.find(h=>h.id==id),b=bud(x.p);modal(`<h3>${esc(x.topic)}</h3><div class="row">${av(b.n,b.c,44)}<div><b>${esc(b.n)}</b><div class="mu">${esc(b.p)} · Smt ${b.s}</div></div></div><p class="mu">${x.date} · ${x.dur} menit · ${x.st}</p><b>Item tersimpan dari sesi ini</b>${x.items.length?x.items.map(i=>`<div>• ${esc(i)}</div>`).join(''):'<div class="mu">Tidak ada.</div>'}<p><small>Pesan dan berkas sementara tidak dapat dipulihkan.</small></p><button class="b s" onclick="cm()">Tutup</button>`)}
/* ===== Profile, password, logout ===== */
function editM(){const p=D().prof;modal(`<h3>Edit Profil &amp; Kriteria</h3><label>Nama</label><input id="x1" value="${esc(p.name)}"><label>Program studi</label><input id="x2" value="${esc(p.prodi)}"><label>Semester</label><input id="x3" type="number" value="${esc(p.sem)}"><label>Bio</label><textarea id="x4">${esc(p.bio)}</textarea><label>Mata kuliah (koma)</label><input id="x5" value="${esc(p.sub.join(', '))}"><label>Jadwal</label><input id="x6" value="${esc(p.sch)}"><label>Mode</label><select id="x7">${['Online','Offline','Keduanya'].map(v=>`<option ${p.mode==v?'selected':''}>${v}</option>`).join('')}</select><div class="row" style="margin-top:14px"><button class="b" onclick="editS()">Simpan</button><button class="b s" onclick="cm()">Batal</button></div>`)}
function pwM(){modal(`<h3>Ganti Kata Sandi</h3><label>Kata sandi lama</label><input id="w1" type="password"><label>Kata sandi baru</label><input id="w2" type="password"><div class="row" style="margin-top:14px"><button class="b" onclick="pwS()">Simpan</button><button class="b s" onclick="cm()">Batal</button></div>`)}
const outM=()=>modal(`<h3>Keluar dari akun?</h3><p>Profil, riwayat, dan arsipmu tetap tersimpan.</p><div class="row"><button class="b" onclick="out()">Ya, Keluar</button><button class="b s" onclick="cm()">Batal</button></div>`);
document.addEventListener('click',e=>{const d=$('dd');if(d&&!d.hidden&&!e.target.closest('.bell'))d.hidden=true});
setInterval(()=>{const s=S.me&&D()&&D().ses;if(s)document.querySelectorAll('.tm').forEach(e=>e.textContent=dur(s))},1000);
/* ===== API & real-time ===== */
let ws=null,nT;
async function api(p,b){try{const r=await fetch('/api/'+p,b===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){toast(j.error||'Terjadi kesalahan');return null}return j}catch(e){toast('Tidak dapat terhubung ke server');return null}}
async function pull(full){const j=await api('state');if(!j)return;const o=ST&&ST.ses?ST.ses.id:0;S.me=j.me;ST=j.d;BUD=j.buddies||[];const n=ST&&ST.ses?ST.ses.id:0;
 if(S.me)connectWS();
 if(full||o!=n||!S.me)render();else if(S.page=='disc')drawChat();else if(['home','hist','arc'].includes(S.page))render();
 const bb=document.querySelector('.bell>button');if(bb&&ST)bb.innerHTML='Notifikasi'+(ST.inc.length?`<em>${ST.inc.length}</em>`:'')}
function connectWS(){if(ws&&ws.readyState<2)return;ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws');
 ws.onmessage=e=>{const m=JSON.parse(e.data),T={incoming:['Permintaan match baru masuk','req'],accepted:['Permintaan diterima! Buka menu Diskusi','acc'],rejected:['Permintaan kamu ditolak','acc'],ended:['Buddy mengakhiri diskusi','dis']}[m.ev];if(T)toast(...T);pull()};
 ws.onclose=()=>{ws=null;if(S.me)setTimeout(connectWS,2000)}}
async function login(){if(await api('login',{email:$('e').value,password:$('p').value})){S.page='home';await pull(true)}}
async function reg(){const n=$('n').value.trim(),e=$('e').value.trim().toLowerCase(),p=$('p').value;if(!n||!e||!p)return toast('Lengkapi semua kolom');if(p!==$('p2').value)return toast('Konfirmasi kata sandi tidak sama');
 if(await api('register',{name:n,email:e,password:p})){S.page='home';await pull(true)}}
async function out(){await api('logout',{});S.me=null;ST=null;am='login';S.page='home';cm();if(ws)ws.close();render()}
async function setupS(){const g=i=>$('s'+i).value.trim(),sub=g(6).split(',').map(x=>x.trim()).filter(Boolean);if(!g(1)||!g(2)||!g(3)||!g(5)||!sub.length||!g(7))return toast('Lengkapi semua data profil');
 if(await api('profile',{name:g(1),prodi:g(2),sem:g(3),mode:$('s4').value,bio:g(5),sub,sch:g(7)})){S.page='home';await pull(true)}}
async function editS(){const g=i=>$('x'+i).value.trim(),sub=g(5).split(',').map(x=>x.trim()).filter(Boolean);if(!g(1)||!g(2)||!sub.length)return toast('Nama, prodi, dan mata kuliah wajib diisi');
 if(await api('profile',{name:g(1),prodi:g(2),sem:g(3),bio:g(4),sub,sch:g(6),mode:$('x7').value})){cm();await pull(true);toast('Profil diperbarui')}}
async function pwS(){if(await api('password',{old:$('w1').value,neu:$('w2').value})){cm();toast('Kata sandi diganti')}}
async function findM(){const g=i=>$('r'+i).value.trim();if(!g(4)||!g(5))return toast('Isi mata kuliah dan topik');
 if(await api('studyreq',{sub:g(4),topic:g(5),date:g(6),time:g(7),mode:$('r8').value})){LM={x:[g(4),g(5)]};await pull();$('res').innerHTML=resH();toast('Rekomendasi ditemukan')}}
async function cancelR(id){if(await api('studyreq/cancel',{id})){await pull();$('res').innerHTML=resH()}}
async function doSend(id){const j=await api('request',{to:id,topic:$('q1').value.trim(),msg:$('q2').value.trim()});cm();if(j)toast('Permintaan terkirim ke '+bud(id).n)}
async function accI(id){if(await api('accept',{id})){await pull(true);go('disc');toast('Match diterima, diskusi dimulai','acc')}}
async function rejI(id){if(await api('reject',{id})){S.page='home';await pull(true);toast('Permintaan ditolak; pengirim diberi tahu','acc')}}
async function sendT(){const i=$('mi'),v=i.value.trim();if(!v)return;i.value='';if(await api('msg',{t:'txt',x:v}))await pull()}
function pickF(inp){const f=inp.files[0];inp.value='';if(!f)return;const x=f.name.split('.').pop().toLowerCase();if(!OK.includes(x))return toast('Tipe berkas tidak didukung');if(f.size>5e6)return toast('Ukuran berkas maksimal 5 MB');
 const r=new FileReader();r.onload=()=>{pend={k:'file',name:f.name,data:r.result};shareM()};r.readAsDataURL(f)}
async function conf(a){const m={t:pend.k,name:pend.name,data:pend.data,allow:!!a};if(pend.k=='link'){let u=$('lu').value.trim();if(!u)return toast('Masukkan URL');if(!/^https?:\/\//i.test(u))u='https://'+u;m.url=u}
 if(await api('msg',m)){cm();await pull();toast(a?'Terkirim (boleh disimpan)':'Terkirim (tidak boleh disimpan)')}}
async function viewF(id){const m=msgOf(id),j=await api('msgfile/'+id);if(!j)return;const d=j.data;let h='<p class="mu">Pratinjau tidak tersedia untuk berkas ini.</p>';
 if(d.startsWith('data:image'))h=`<img src="${esc(d)}" style="max-width:100%">`;else if(d.startsWith('data:text')){try{h=`<pre style="white-space:pre-wrap">${esc(decodeURIComponent(escape(atob(d.split(',')[1]))))}</pre>`}catch(e){}}
 modal(`<h3>${esc(m.name)}</h3>${h}<button class="b s" onclick="cm()">Tutup</button>`)}
async function saveArc(id){if(await api('save',{mid:id})){await pull();toast('Tersimpan ke Arsip','dis')}}
function arcOpen(id){const a=D().arc.find(x=>x.id==id);if(a.type=='link')return window.open(a.url,'_blank','noopener');location.href='/api/archive/'+id+'/download'}
async function arcDel(id){if(await api('archive/delete',{id})){await pull(true);toast('Item dihapus dari arsip')}}
async function endS(){if(await api('end',{})){cm();await pull(true);go('hist');toast('Diskusi diakhiri','dis')}}
function notesIn(v){D().ses.notes=v;clearTimeout(nT);nT=setTimeout(()=>api('notes',{v}),600)}
pull(true);
</script></body></html>
